[project]
name = "catanpro"
version = "0.1.0"
description = "Multiplayer Catan over Flask-SocketIO"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0,<4",
    "flask-socketio>=5.3.6,<6",
    "python-socketio>=5.10.0,<6",
    # Threading async mode needs this for real WebSocket transport; without it
    # the server silently falls back to HTTP long-polling.
    "simple-websocket>=1.0,<2",
    "gunicorn>=21.2,<24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.14.2",
    "mypy==1.18.2",
]

[tool.setuptools]
packages = ["game"]
package-dir = { "" = "server" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
# Preserve quotes: the codebase uses single quotes and normalising them would
# bury a wrapping fix under a whole-file cosmetic diff.
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
# Strict only where it pays: the rules engine. The transport layer stays loose
# so the rollout does not produce hundreds of errors and get abandoned.
[[tool.mypy.overrides]]
module = "game.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests are excluded by default: they launch Chromium and a real
# server. Run them with `pytest -m slow`.
addopts = "--import-mode=importlib -m 'not slow'"
# "tests" as well as "server": the browser suites share `browser_harness`,
# which is support code rather than a test module.
pythonpath = ["server", "tests"]
markers = ["slow: end-to-end socket tests, excluded from the fast rules suite"]
